# يبني ipa غير موقَّع على Mac سحابي. التوقيع يتم في متجر التثبيت (شهادته).
name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          set +e
          xcodebuild -project AbuAzz.xcodeproj -scheme AbuAzz -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          RC=$?
          tail -n 40 build.log
          if [ $RC -ne 0 ]; then
            grep -E "error:|fatal|not installed|Unable" build.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            echo "::error::xcodebuild exit $RC; $(xcodebuild -version | tr '\n' ' ')"
            exit $RC
          fi

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AbuAzz.app Payload/
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/AbuAzz.app/Info.plist)
          echo "VER=$VER" >> "$GITHUB_ENV"
          zip -qry "AbuAzz-$VER.ipa" Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AbuAzz-ipa
          path: "*.ipa"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ipa-${{ github.run_number }}" "AbuAzz-$VER.ipa" \
            --title "AbuAzz $VER (build ${{ github.run_number }})" \
            --notes "Unsigned IPA. Sign it with your sideloading tool."
